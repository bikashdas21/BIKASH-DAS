name: Build & Release Zero-Grid Artifacts

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Installable Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Build Environment
        run: |
          chmod +x gradlew
          touch .env
          echo "Build environment prepared."

      - name: Setup Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          CUSTOM_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          CUSTOM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CUSTOM_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using secret production keystore provided via repository secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${CUSTOM_STORE_PASS}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${CUSTOM_KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${CUSTOM_KEY_PASS}" >> $GITHUB_ENV
          else
            echo "Generating valid release signing keystore for artifact compilation..."
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass android \
              -keypass android \
              -dname "CN=Zero-Grid, OU=Engineering, O=ZeroGrid, L=Global, S=Global, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: Validate & Measure Release APK
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "FATAL ERROR: app/build/outputs/apk/release/app-release.apk was not created by assembleRelease!"
            exit 1
          fi
          echo "=== VERIFIED GENUINE RELEASE APK GENERATED ==="
          ls -lh app/build/outputs/apk/release/app-release.apk
          APK_BYTES=$(stat -c%s app/build/outputs/apk/release/app-release.apk 2>/dev/null || stat -f%z app/build/outputs/apk/release/app-release.apk)
          echo "Release APK Size: $APK_BYTES bytes"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Grid-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release AAB Bundle
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: Validate & Measure Release AAB
        run: |
          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "FATAL ERROR: app/build/outputs/bundle/release/app-release.aab was not created by bundleRelease!"
            exit 1
          fi
          echo "=== VERIFIED GENUINE RELEASE AAB GENERATED ==="
          ls -lh app/build/outputs/bundle/release/app-release.aab
          AAB_BYTES=$(stat -c%s app/build/outputs/bundle/release/app-release.aab 2>/dev/null || stat -f%z app/build/outputs/bundle/release/app-release.aab)
          echo "Release AAB Size: $AAB_BYTES bytes"

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zero-Grid-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
